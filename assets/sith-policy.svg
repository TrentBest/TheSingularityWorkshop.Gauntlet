<svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" role="img" aria-labelledby="title desc">
  <title id="title">Sith Policy: COMPLIANT</title>
  <desc id="desc">Exactly two branches exist: master and development. Two knights duel in the training ground.</desc>
  <defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#252b3a"/><stop offset="1" stop-color="#090d17"/></linearGradient></defs>
  <style>.duel{transform-origin:48px 57px;animation:clash 2.8s ease-in-out infinite alternate}@keyframes clash{from{transform:translateX(-2px) rotate(-2deg)}to{transform:translateX(2px) rotate(2deg)}}@media(prefers-reduced-motion:reduce){.duel{animation:none}}</style>
  <rect x="1" y="1" width="438" height="102" rx="14" fill="url(#metal)" stroke="#36d399" stroke-width="1.5"/>
  <g class="duel"><path d="M13 72 Q48 83 83 72" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M24 70 L29 52 L36 48 L43 56 L45 72 Z" fill="#cbd5e1" stroke="#f8fafc"/><path d="M31 49 L28 40 L36 35 L43 41 L41 50 Z" fill="#e2e8f0"/><path d="M59 72 L61 55 L68 48 L76 53 L81 72 Z" fill="#7c879b" stroke="#cbd5e1"/><path d="M61 48 L60 39 L68 34 L76 40 L73 50 Z" fill="#94a3b8"/><path d="M37 48 L57 29 M66 47 L45 28" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/><circle cx="48" cy="29" r="3" fill="#fff"/></g>
  <text x="108" y="31" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">THE SINGULARITY WORKSHOP</text>
  <text x="108" y="56" fill="#36d399" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">THE DUEL CONTINUES</text>
  <text x="108" y="77" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="11">2 branches · master + development</text>
  <text x="420" y="94" fill="#64748b" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="8">SITH POLICY · LIVE EVALUATION</text>
</svg>
