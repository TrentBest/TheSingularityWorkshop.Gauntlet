name: Gauntlet core contracts

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Gauntlet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore JCS spike in locked mode
        run: dotnet restore tests/Gauntlet.Jcs.Tests/Gauntlet.Jcs.Tests.csproj --use-lock-file

      - name: Test deterministic campaign evaluator and strict receipt wire contract
        run: dotnet test tests/Gauntlet.Core.Tests/Gauntlet.Core.Tests.csproj --configuration Release

      - name: Test RFC 8785 integration spike
        run: dotnet test tests/Gauntlet.Jcs.Tests/Gauntlet.Jcs.Tests.csproj --configuration Release

      - name: Verify canonicalizer dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          packages="$(dotnet list tests/Gauntlet.Jcs.Tests/Gauntlet.Jcs.Tests.csproj package --include-transitive)"
          printf '%s\n' "$packages"
          grep -Eq 'System.Text.Json[[:space:]]+10\.0\.15' <<< "$packages"
          if grep -Eq 'System.Text.Json[[:space:]]+8\.0\.5' <<< "$packages"; then
            echo "The canonicalizer's old System.Text.Json minimum must not win package resolution." >&2
            exit 1
          fi

      - name: Audit vulnerable transitive dependencies
        run: dotnet list tests/Gauntlet.Jcs.Tests/Gauntlet.Jcs.Tests.csproj package --vulnerable --include-transitive

      - name: Upload generated JCS dependency lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gauntlet-jcs-packages-lock
          path: tests/Gauntlet.Jcs.Tests/packages.lock.json
          if-no-files-found: error
